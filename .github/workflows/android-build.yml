name: Android Release APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release-apks:
    name: Build signed minified release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Hollow VPN Release,O=Hollow VPN,C=US"
          fi

      - name: Ensure .env file exists
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build v7a, arm64-v8a, and universal release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: gradle assembleRelease --stacktrace

      - name: Upload armeabi-v7a release APK
        uses: actions/upload-artifact@v4
        with:
          name: hollow-vpn-armeabi-v7a-release
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error

      - name: Upload arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: hollow-vpn-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload universal release APK
        uses: actions/upload-artifact@v4
        with:
          name: hollow-vpn-universal-release
          path: app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error
